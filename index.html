<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#282828" />
    <meta name="description" content="Computer science student at KIT" />
    <title>Jannis Weisbrodt</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/700.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23282828'/><text x='50' y='68' font-family='monospace' font-weight='bold' font-size='56' text-anchor='middle' fill='%2398971a'>&gt;_</text></svg>"
    />
    <style>
      :root {
        --bg: #282828;
        --bg1: #3c3836;
        --fg: #ebdbb2;
        --gray: #a89984;
        --red: #cc241d;
        --green: #98971a;
        --yellow: #d79921;
        --blue: #458588;
        --purple: #b16286;
        --aqua: #8ec07c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        color: var(--fg);
        font:
          clamp(14px, 3.6vw, 19px)/1.5 Iosevka,
          monospace;
      }

      #term {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 64px 20px 32px;
        cursor: text;
      }

      #screen {
        margin: auto;
        width: 100%;
        max-width: 760px;
      }

      .line {
        min-height: 1.5em;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .user {
        color: var(--yellow);
      }
      .host {
        color: var(--purple);
      }
      .dir {
        color: var(--blue);
      }
      .sign,
      .cmd {
        color: var(--green);
      }
      .sign.err {
        color: var(--red);
      }
      .bad {
        color: var(--red);
        font-weight: bold;
      }
      .gray {
        color: var(--gray);
      }
      .path {
        color: var(--purple);
      }
      .dir-path {
        text-decoration: underline;
      }
      .path::selection {
        background: var(--purple);
      }

      a {
        color: var(--fg);
        text-decoration-color: var(--gray);
        text-underline-offset: 3px;
      }

      a:hover {
        color: var(--aqua);
        text-decoration-color: var(--aqua);
      }

      .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        margin-right: -2px;
        vertical-align: -0.2em;
        background: var(--fg);
        animation: blink 1s steps(1) infinite;
      }

      .cursor.solid {
        animation: none;
      }
      body:not(.focused) .cursor {
        animation: none;
        opacity: 0.35;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      #input {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        font-size: 16px;
      }

      footer {
        width: calc(100% - 40px);
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 0 32px;
        border-top: 1px solid var(--bg1);
        color: var(--gray);
        font-size: 14px;
      }

      ::selection {
        background: var(--fg);
        color: var(--bg);
      }
      .user::selection {
        background: var(--yellow);
      }
      .host::selection {
        background: var(--purple);
      }
      .dir::selection {
        background: var(--blue);
      }
      .sign::selection,
      .cmd::selection {
        background: var(--green);
      }
      .sign.err::selection,
      .bad::selection {
        background: var(--red);
      }
      .gray::selection,
      footer::selection,
      footer ::selection {
        background: var(--gray);
      }
    </style>
  </head>
  <body>
    <main id="term">
      <div id="screen">
        <div id="out"></div>
        <div id="live" class="line"></div>
        <noscript>
          <div class="line"><b>Jannis Weisbrodt</b></div>
          <div class="line">
            Computer science student at <a href="https://www.kit.edu">KIT</a>
          </div>
          <div class="line">
            <a href="https://github.com/weisbrja">github</a>
            <a href="https://gitlab.com/weisbrja">gitlab</a>
            <a href="mailto:jannis@weisbrodt.me">email</a>
          </div>
        </noscript>
      </div>
    </main>
    <input
      id="input"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
    />
    <footer>© <span id="year">2026</span> Jannis Weisbrodt</footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const term = $("term");
      const out = $("out");
      const live = $("live");
      const input = $("input");

      $("year").textContent = new Date().getFullYear();

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }

      function link(href, text = href.replace("mailto:", "")) {
        const a = el("a", null, text);
        a.href = href;
        if (href.startsWith("http")) a.target = "_blank";
        return a;
      }

      function fail(code, msg) {
        status = code;
        return [msg];
      }

      function noArgs(name, fn) {
        return (args) =>
          args.length ? fail(1, `${name}: too many arguments`) : fn();
      }

      function badOption(name, arg) {
        return fail(
          name === "ls" ? 2 : 1,
          arg.startsWith("--")
            ? `${name}: unrecognized option '${arg}'`
            : `${name}: invalid option -- '${arg[1]}'`,
        );
      }

      const isOption = (arg) => arg.startsWith("-") && arg !== "-";

      const commands = {
        whoami: [
          "about me",
          (args) =>
            args.length
              ? fail(1, `whoami: extra operand '${args[0]}'`)
              : [
                  el("b", null, "Jannis Weisbrodt"),
                  [
                    "Computer science student at ",
                    link("https://www.kit.edu", "KIT"),
                  ],
                ],
        ],
        email: [
          "send me an email",
          noArgs("email", () => [link("mailto:jannis@weisbrodt.me")]),
        ],
        github: [
          "my github profile",
          noArgs("github", () => [link("https://github.com/weisbrja")]),
        ],
        gitlab: [
          "my gitlab profile",
          noArgs("gitlab", () => [link("https://gitlab.com/weisbrja")]),
        ],
        ls: ["list directory contents", ls],
        cd: ["change directory", cd],
        cat: ["print files", cat],
        help: [
          "show this help",
          noArgs("help", () =>
            Object.entries(commands).map(([name, [desc]]) => [
              el("span", "cmd", name.padEnd(8)),
              desc,
            ]),
          ),
        ],
        clear: [
          "clear the terminal",
          noArgs("clear", () => {
            out.replaceChildren();
            return [];
          }),
        ],
      };

      const fs = {
        s3cr3t: {
          "flag.txt": "got you :)",
        },
      };
      let cwd = [];

      const isDir = (node) => typeof node === "object";

      function resolve(path) {
        const parts = /^[~/]/.test(path) ? [] : [...cwd];
        for (const seg of path.replace(/^~(?=\/|$)/, "").split("/")) {
          if (seg === "..") parts.pop();
          else if (seg && seg !== ".") parts.push(seg);
        }
        let node = fs;
        for (const seg of parts) {
          if (!isDir(node) || !Object.hasOwn(node, seg)) return null;
          node = node[seg];
        }
        return { node, parts };
      }

      function ls(paths) {
        const option = paths.find(isOption);
        if (option) return badOption("ls", option);

        const lines = [];
        for (const path of paths.length ? paths : ["."]) {
          const found = resolve(path);
          if (!found) {
            lines.push(
              `ls: cannot access '${path}': No such file or directory`,
            );
            status = 2;
          } else if (!isDir(found.node)) {
            lines.push(path);
          } else {
            if (paths.length > 1) lines.push(`${path}:`);
            const names = Object.keys(found.node).sort();
            if (names.length)
              lines.push(
                names.flatMap((name, i) => [
                  i ? "  " : "",
                  isDir(found.node[name]) ? el("b", "dir", name) : name,
                ]),
              );
          }
        }
        return lines;
      }

      function cd(args) {
        if (args.length > 2) return fail(1, "cd: too many arguments");
        if (args.length === 2)
          return fail(1, `cd: string not in pwd: ${args[0]}`);

        const path = args[0] ?? "~";
        const found = resolve(path);
        if (!found) return fail(1, `cd: no such file or directory: ${path}`);
        if (!isDir(found.node)) return fail(1, `cd: not a directory: ${path}`);
        cwd = found.parts;
        return [];
      }

      function cat(args) {
        const option = args.find(isOption);
        if (option) return badOption("cat", option);

        const lines = [];
        for (const path of args) {
          const found = resolve(path);
          if (!found) {
            lines.push(`cat: ${path}: No such file or directory`);
            status = 1;
          } else if (isDir(found.node)) {
            lines.push(`cat: ${path}: Is a directory`);
            status = 1;
          } else {
            lines.push(...found.node.split("\n"));
          }
        }
        return lines;
      }

      let status = 0;
      let history = [];
      let hpos = 0;
      let draft = "";
      let typing = null;

      function prompt() {
        const f = document.createDocumentFragment();
        f.append(
          el("b", "user", "weisbrja"),
          "@",
          el("b", "host", "website"),
          " ",
          el("b", "dir", ["~", ...cwd].join("/")),
          " ",
          el("b", status ? "sign err" : "sign", "$"),
          " ",
        );
        return f;
      }

      function render(text, cur = -1) {
        const f = document.createDocumentFragment();
        const add = (s, cls) => s && f.append(cls ? el("span", cls, s) : s);
        const [, pre, cmd, rest] = text.match(/^(\s*)(\S*)(.*)$/s);
        const parts = [
          [pre],
          [cmd, Object.hasOwn(commands, cmd) ? "cmd" : "bad"],
        ];
        for (const s of rest.split(/(\s+)/)) {
          const found = s.trim() && resolve(s);
          parts.push([
            s,
            found ? (isDir(found.node) ? "path dir-path" : "path") : null,
          ]);
        }
        let i = 0;

        for (const [s, cls] of parts) {
          if (cur >= i && cur < i + s.length) {
            add(s.slice(0, cur - i), cls);
            f.append(el("span", typing ? "cursor solid" : "cursor"));
            add(s.slice(cur - i), cls);
            cur = -1;
          } else {
            add(s, cls);
          }
          i += s.length;
        }
        if (cur >= 0) f.append(el("span", typing ? "cursor solid" : "cursor"));
        return f;
      }

      function draw() {
        live.replaceChildren(
          prompt(),
          render(input.value, input.selectionStart),
        );
      }

      function output(lines) {
        for (const l of lines) {
          const div = el("div", "line");
          div.append(...[].concat(l));
          out.append(div);
        }
      }

      function echo(line, suffix = "") {
        const div = el("div", "line");
        div.append(prompt(), render(line), suffix);
        out.append(div);
      }

      function set(value, pos = value.length) {
        input.value = value;
        input.setSelectionRange(pos, pos);
        draw();
      }

      function scroll() {
        term.scrollTop = term.scrollHeight;
      }

      function run(line) {
        echo(line);
        if (line.trim() && line !== history.at(-1)) history.push(line);
        hpos = history.length;
        draft = "";

        const [name, ...args] = line.trim().split(/\s+/);
        if (Object.hasOwn(commands, name)) {
          status = 0;
          output(commands[name][1](args));
        } else if (name) {
          output([`zsh: command not found: ${name}`]);
          status = 127;
        }
        set("");
        scroll();
      }

      function complete() {
        const [, head, word] = input.value.match(/^(.*?)(\S*)$/s);
        let candidates;

        if (!head.trim()) {
          candidates = Object.keys(commands);
        } else {
          const dir = word.slice(0, word.lastIndexOf("/") + 1);
          const found = resolve(dir || ".");
          if (!found || !isDir(found.node)) return;
          const dirsOnly = head.trim().split(/\s+/)[0] === "cd";
          candidates = Object.entries(found.node)
            .filter(([, node]) => !dirsOnly || isDir(node))
            .map(([name, node]) => dir + name + (isDir(node) ? "/" : ""));
        }

        const matches = candidates.filter((c) => c.startsWith(word));
        if (!matches.length) return;
        if (matches.length === 1)
          return set(head + matches[0] + (matches[0].endsWith("/") ? "" : " "));

        let prefix = word;
        while (
          matches.every(
            (m) =>
              m[prefix.length] &&
              m[prefix.length] === matches[0][prefix.length],
          )
        ) {
          prefix += matches[0][prefix.length];
        }
        if (prefix !== word) return set(head + prefix);

        echo(input.value);
        output([matches.map((m) => m.replace(/.*\/(?=.)/, "")).join("  ")]);
        scroll();
      }

      const ctrl = {
        a: (v) => set(v, 0),
        e: (v) => set(v),
        u: (v, pos) => set(v.slice(pos), 0),
        k: (v, pos) => set(v.slice(0, pos)),
        w: (v, pos) => {
          const start = v.slice(0, pos).replace(/\S*\s*$/, "").length;
          set(v.slice(0, start) + v.slice(pos), start);
        },
        l: () => {
          out.replaceChildren();
          draw();
        },
        c: (v) => {
          echo(v, "^C");
          status = 130;
          hpos = history.length;
          set("");
          scroll();
        },
      };

      input.addEventListener("keydown", (e) => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          typing = null;
          draw();
        }, 500);

        const v = input.value;
        const pos = input.selectionStart;

        if (e.key === "Enter") {
          e.preventDefault();
          run(v);
        } else if (e.key === "Tab") {
          e.preventDefault();
          complete();
        } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          if (hpos === history.length) draft = v;
          hpos = Math.max(
            0,
            Math.min(history.length, hpos + (e.key === "ArrowUp" ? -1 : 1)),
          );
          set(hpos === history.length ? draft : history[hpos]);
        } else if (e.ctrlKey && !e.altKey && !e.metaKey && ctrl[e.key]) {
          e.preventDefault();
          ctrl[e.key](v, pos);
        } else {
          requestAnimationFrame(draw);
        }
      });

      input.addEventListener("input", () => {
        draw();
        scroll();
      });
      input.addEventListener("focus", () => {
        document.body.classList.add("focused");
        draw();
      });
      input.addEventListener("blur", () => {
        document.body.classList.remove("focused");
        draw();
      });
      document.addEventListener("selectionchange", () => {
        if (document.activeElement === input) draw();
      });

      term.addEventListener("mouseup", (e) => {
        if (!e.target.closest("a") && getSelection().isCollapsed)
          input.focus({ preventScroll: true });
      });

      output([el("span", "gray", "type 'help' to see available commands")]);
      run("whoami");
      input.focus({ preventScroll: true });
    </script>
  </body>
</html>
